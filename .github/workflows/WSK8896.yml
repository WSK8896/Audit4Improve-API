name: Flujo WSK8896 - Issues y Proyecto

on:
  issues:
    types: [opened]
  project_card:
    types: [moved]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar información del evento
        run: |
          echo "🔔 Evento: ${{ github.event_name }}"
          echo "📌 Repositorio: ${{ github.repository }}"
          echo "🧑 Usuario: ${{ github.actor }}"
          echo "📄 Detalles del evento:"
          echo '${{ toJSON(github.event) }}'

      - name: Imprimir arte ASCII
        run: |
          echo "╔════════════════════════╗"
          echo "║  ¡Hola desde WSK8896!  ║"
          echo "╚════════════════════════╝"
