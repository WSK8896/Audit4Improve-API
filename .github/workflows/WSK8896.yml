name: Flujo WSK8896 - Issues y Proyecto

on:
  issues:
    types: [opened]
  project_card:
    types: [moved]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar evento recibido
        run: |
          echo "🔔 Evento: ${{ github.event_name }}"
          echo "📌 Repositorio: ${{ github.repository }}"
          echo "🧑 Usuario: ${{ github.actor }}"
          echo "📄 Detalle del evento:"
          echo "${{ toJSON(github.event) }}"

      - name: Acción divertida: imprimir mensaje en ASCII
        run: |
          echo "
          ███████╗██╗    ██╗███████╗██╗  ██╗
          ██╔════╝██║    ██║██╔════╝██║ ██╔╝
          █████╗  ██║ █╗ ██║█████╗  █████╔╝ 
          ██╔══╝  ██║███╗██║██╔══╝  ██╔═██╗ 
          ███████╗╚███╔███╔╝███████╗██║  ██╗
          ╚══════╝ ╚══╝╚══╝ ╚══════╝╚═╝  ╚═╝"
